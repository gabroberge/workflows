name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node.js line vitest 5 runs on and the current one, against both
        # supported NestJS majors.
        node-version: [22, 24]
        nestjs-version: ['11', '12']
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SQL_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm install
      # The devDependencies pin NestJS 12 packages (@nestjs/platform-fastify 12 peers @nestjs/core ^12), so the
      # swap relaxes peer checks, as the other repos' CI does. Every @nestjs package the tests load is swapped.
      - name: Install NestJS ${{ matrix.nestjs-version }}
        run: npm install --no-save --legacy-peer-deps @nestjs/common@${{ matrix.nestjs-version }} @nestjs/core@${{ matrix.nestjs-version }} @nestjs/testing@${{ matrix.nestjs-version }} @nestjs/platform-express@${{ matrix.nestjs-version }} @nestjs/platform-fastify@${{ matrix.nestjs-version }} @nestjs/cqrs@${{ matrix.nestjs-version }}
      - name: Generate the Prisma client
        # tests/postgres runs PostgresWorkflowStore through fromPrisma(); the tests' global setup does the same.
        run: npm run generate:prisma
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: e2e tests
        run: npm run test:e2e
